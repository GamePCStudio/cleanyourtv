plugins {
    id 'com.android.application'
}

def releaseKeystore = providers.gradleProperty('releaseKeystore').orNull

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.gathin.tvhome')
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '2.4'
    }

    signingConfigs {
        if (releaseKeystore != null) {
            release {
                storeFile file(releaseKeystore)
                storePassword providers.gradleProperty('releaseKeystorePassword').get()
                keyAlias providers.gradleProperty('releaseKeyAlias').getOrElse('release')
                keyPassword providers.gradleProperty('releaseKeyPassword').get()
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published. Debug key by default; pass -PreleaseKeystore=... to
            // sign with a release key instead (see .github/workflows/release-apk.yml). A different key
            // means an already-installed build must be uninstalled first, and it changes the signer the
            // module-card spec pins (docs/specs/card.md).
            signingConfig releaseKeystore != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}

name: Release APK

# Manual build of the launcher signed with the owner's release key, in both HOME identities
# (see docs/devices/xiaomi-mitv-aetp0-dofus.md for why the second one exists).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Launcher, release key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Unpack the release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          [ -n "$RELEASE_KEYSTORE_B64" ] || { echo "RELEASE_KEYSTORE_B64 secret is missing"; exit 1; }
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "${{ secrets.RELEASE_STORE_PASSWORD }}" \
            | sed -n '1,12p'

      - name: Build both HOME identities
        working-directory: launcher
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          sign=(-PreleaseKeystore="$RUNNER_TEMP/release.jks"
                -PreleaseKeystorePassword="$STORE_PASSWORD"
                -PreleaseKeyAlias=release
                -PreleaseKeyPassword="$KEY_PASSWORD")
          ./gradlew --no-daemon clean assembleRelease "${sign[@]}"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/cleanyourtv-gathin.apk"
          ./gradlew --no-daemon clean assembleRelease "${sign[@]}" -PlauncherApplicationId=com.ts.launcher
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/cleanyourtv-allowlist.apk"

      - name: Verify signatures and identities
        run: |
          for apk in cleanyourtv-gathin cleanyourtv-allowlist; do
            f="$RUNNER_TEMP/$apk.apk"
            echo "=== $apk.apk ==="
            stat -c 'size: %s bytes' "$f"
            apksigner verify --verbose --print-certs "$f" | sed -n '1,20p'
            aapt dump badging "$f" | grep -E "^package:|sdkVersion|targetSdkVersion" || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-release-apks
          path: |
            ${{ runner.temp }}/cleanyourtv-gathin.apk
            ${{ runner.temp }}/cleanyourtv-allowlist.apk
          retention-days: 30
          if-no-files-found: error
